{% load static humanize %}
<!doctype html>
<html lang="es-CL">
    <head>
        <title>Funcomics</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <link rel="stylesheet" href="{% static 'css/estilo.css' %}" />
    </head>

    <body>
        <header class="store-header text-center">
            <div class="container">
                <h1 class="display-5 mb-2">Funcomics</h1>
                <p>Reserva tus cómics favoritos</p>
            </div>
        </header>

        <main>

            {{ comic }}

                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <a name="" id="" class="btn btn-danger" href="/">CANCELAR</a>
                    <button type="submit" class="btn btn-primary float-end">RESERVAR</button>





        </main>
        <footer class="store-footer text-center py-4">
            <div class="container">
                <p class="mb-0">Funcomics · Todos los derechos reservados</p>
            </div>
        </footer>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
